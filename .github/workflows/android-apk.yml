name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download upstream Android Bionic ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.6.0-beta"
          ASSET="N_m3u8DL-RE_v0.6.0-beta_android-bionic-arm64_20260629.tar.gz"
          URL="https://github.com/nilaoda/N_m3u8DL-RE/releases/download/${VERSION}/${ASSET}"
          mkdir -p app/src/main/assets/native app/src/main/jniLibs/arm64-v8a .native-unpack
          curl --fail --location --retry 3 --retry-all-errors "${URL}" -o /tmp/nm3u8dl-android-arm64.tar.gz
          tar -xzf /tmp/nm3u8dl-android-arm64.tar.gz -C .native-unpack
          BINARY="$(find .native-unpack -type f -name 'N_m3u8DL-RE' -print -quit)"
          if [ -z "${BINARY}" ]; then
            echo "The upstream ARM64 archive did not contain N_m3u8DL-RE"
            tar -tzf /tmp/nm3u8dl-android-arm64.tar.gz | head -100
            exit 1
          fi
          cp "${BINARY}" app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so
          cp -a "$(dirname "${BINARY}")"/. app/src/main/assets/native/
          rm -f app/src/main/assets/native/N_m3u8DL-RE
          echo "Bundled executable:"
          ls -l app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so
          file app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so

      - name: Build Android ARM64 OpenSSL runtime
        shell: bash
        run: |
          set -euo pipefail
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$TOOLCHAIN:$PATH"
          mkdir -p .openssl-src
          curl --fail --location --retry 3 --retry-all-errors https://www.openssl.org/source/openssl-3.3.3.tar.gz -o /tmp/openssl.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C .openssl-src --strip-components=1
          cd .openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=29 --prefix="$GITHUB_WORKSPACE/.openssl-install" shared
          make -j2
          make install_sw
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          SSL_LIB="$(find .openssl-install -type f -name 'libssl.so*' | head -n 1)"
          CRYPTO_LIB="$(find .openssl-install -type f -name 'libcrypto.so*' | head -n 1)"
          test -n "$SSL_LIB"
          test -n "$CRYPTO_LIB"
          cp "$SSL_LIB" app/src/main/jniLibs/arm64-v8a/libssl.so
          cp "$SSL_LIB" app/src/main/jniLibs/arm64-v8a/libssl.so.3
          cp "$CRYPTO_LIB" app/src/main/jniLibs/arm64-v8a/libcrypto.so
          cp "$CRYPTO_LIB" app/src/main/jniLibs/arm64-v8a/libcrypto.so.3
          readelf -h app/src/main/jniLibs/arm64-v8a/libssl.so | grep -q 'AArch64'
          readelf -h app/src/main/jniLibs/arm64-v8a/libcrypto.so | grep -q 'AArch64'
          ls -lh app/src/main/jniLibs/arm64-v8a/libssl.so app/src/main/jniLibs/arm64-v8a/libcrypto.so

      - name: Patch engine library search path
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf
          patchelf --set-rpath '$ORIGIN' app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so
          echo "Engine dynamic section:"
          readelf -d app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so | grep -E 'NEEDED|RPATH|RUNPATH' || true
          readelf -d app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so | grep -q '\$ORIGIN'

      - name: Download static Android ARM64 FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="9.0.2"
          URL="https://github.com/Tyrrrz/FFmpegBin/releases/download/${VERSION}/ffmpeg-android-arm64.zip"
          EXPECTED_SHA256="5557b6538846b73f95f28ae8a3b2b19499d5d5f42021ce2458f5c7add553b6fe"
          mkdir -p .ffmpeg-unpack
          curl --fail --location --retry 3 --retry-all-errors "${URL}" -o /tmp/ffmpeg-android-arm64.zip
          echo "${EXPECTED_SHA256}  /tmp/ffmpeg-android-arm64.zip" | sha256sum --check
          unzip -q /tmp/ffmpeg-android-arm64.zip -d .ffmpeg-unpack
          FFMPEG="$(find .ffmpeg-unpack -type f -name ffmpeg -print -quit)"
          if [ -z "${FFMPEG}" ]; then
            echo "The Android ARM64 FFmpeg archive did not contain an ffmpeg executable"
            find .ffmpeg-unpack -maxdepth 4 -type f -print
            exit 1
          fi
          install -m 755 "${FFMPEG}" app/src/main/assets/native/ffmpeg
          readelf -h app/src/main/assets/native/ffmpeg | grep -q 'AArch64'
          ls -lh app/src/main/assets/native/ffmpeg

      - name: Build Bento4 mp4decrypt for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/axiomatic-systems/Bento4.git .bento4
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          cmake -S .bento4 -B .bento4/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_APPS=ON
          cmake --build .bento4/build-android --target mp4decrypt --parallel 2
          MP4DECRYPT="$(find .bento4/build-android -type f -name mp4decrypt -print -quit)"
          test -n "$MP4DECRYPT"
          install -m 755 "$MP4DECRYPT" app/src/main/assets/native/mp4decrypt
          readelf -h app/src/main/assets/native/mp4decrypt | grep -q 'AArch64'
          ls -lh app/src/main/assets/native/mp4decrypt

      - name: Verify Android ARM64 executable payload
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so | grep -E 'Class:|Machine:'
          readelf -h app/src/main/jniLibs/arm64-v8a/libN_m3u8DL-RE.so | grep -q 'AArch64'
          test -x app/src/main/assets/native/ffmpeg
          readelf -h app/src/main/assets/native/ffmpeg | grep -q 'AArch64'
          test -x app/src/main/assets/native/mp4decrypt
          readelf -h app/src/main/assets/native/mp4decrypt | grep -q 'AArch64'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "${APK}"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt dump badging "${APK}" | grep "package:"
          unzip -l "${APK}" | grep 'lib/arm64-v8a/libN_m3u8DL-RE.so'
          unzip -l "${APK}" | grep 'lib/arm64-v8a/libssl.so'
          unzip -l "${APK}" | grep 'lib/arm64-v8a/libcrypto.so'
          unzip -l "${APK}" | grep 'assets/native/ffmpeg'
          unzip -l "${APK}" | grep 'assets/native/mp4decrypt'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N-m3u8DL-RE-Android-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
