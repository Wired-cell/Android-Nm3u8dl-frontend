name: grab-frames

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Signed MPD URL (paste a fresh one — signatures expire)'
        required: true
      decryption_key:
        description: 'ClearKey as kid:key (hex)'
        required: true
        default: 'a5af41281e41febcdbb788ae366ecdac:862ae9b7afb13dfbaea2574948301edc'
      max_height:
        description: 'Max height in px'
        required: false
        default: '240'
      frame_count:
        description: 'How many stills to extract'
        required: false
        default: '12'
      seconds_between:
        description: 'Seconds between stills'
        required: false
        default: '8'

permissions:
  contents: read

concurrency:
  group: grab-frames-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VIDEO_URL: ${{ inputs.video_url }}
      KEY: ${{ inputs.decryption_key }}
      MAX_HEIGHT: ${{ inputs.max_height }}
      FRAME_COUNT: ${{ inputs.frame_count }}
      SECONDS_BETWEEN: ${{ inputs.seconds_between }}
      BENTO4_VERSION: '1-6-0-641'

    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3 unzip curl ca-certificates

      - name: Install Bento4 (mp4decrypt)
        run: |
          set -euo pipefail
          curl -fsSL -o bento4.zip \
            "https://www.bok.net/Bento4/binaries/Bento4-SDK-${BENTO4_VERSION}.x86_64-unknown-linux.zip"
          unzip -q bento4.zip -d bento4
          BENTO_BIN="$PWD/$(find bento4 -maxdepth 1 -type d -name 'Bento4-SDK-*')/bin"
          echo "$BENTO_BIN" >> "$GITHUB_PATH"

      - name: Inspect manifest
        run: |
          set -euo pipefail
          curl -fsSL "$VIDEO_URL" -o mpd.xml
          wc -c mpd.xml
          head -c 3000 mpd.xml

      - name: Fetch init + segments
        run: |
          set -euo pipefail
          python3 scripts/fetch_dash.py encrypted.mp4
          ls -l encrypted.mp4
          echo "--- encrypted probe (moov must be present here) ---"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,nb_frames \
            -of default=nw=1 encrypted.mp4

      - name: Decrypt
        run: |
          set -euo pipefail
          mp4decrypt --key "$KEY" encrypted.mp4 clear.mp4
          test -s clear.mp4 || { echo "decrypt produced an empty file"; exit 1; }
          ls -l clear.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height -show_entries format=duration \
            -of default=nw=1 clear.mp4 | tee probe.txt

      - name: Extract stills
        run: |
          set -euo pipefail
          mkdir -p shots
          ffmpeg -hide_banner -loglevel error -y -i clear.mp4 \
            -vf "fps=1/${SECONDS_BETWEEN},scale=-2:${MAX_HEIGHT}" \
            -frames:v "${FRAME_COUNT}" -q:v 3 shots/shot_%03d.jpg
          ffmpeg -hide_banner -loglevel error -y -i 'shots/shot_%03d.jpg' \
            -vf "scale=320:-2,tile=4x3:padding=4" -frames:v 1 contact-sheet.jpg
          ls -l shots
          test "$(ls -1 shots | wc -l)" -gt 0

      - name: Upload stills (not the video)
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.run_number }}
          path: |
            shots/
            contact-sheet.jpg
            probe.txt
            mpd.xml
          retention-days: 7
          if-no-files-found: error

      - name: Diagnostics
        if: failure()
        run: |
          ls -laR . | head -100
          for f in encrypted.mp4 clear.mp4; do
            [ -f "$f" ] && { echo "== $f $(stat -c%s "$f") bytes"; xxd "$f" | head -4; }
          done
