name: grab-frames

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Signed MPD URL (signature expires — paste a fresh one)'
        required: true
        default: 'https://url1.b-cdn.net/92de350b-9af6-4b32-8177-0331ede4066b/master.mpd?Signature=1UHpkFoQ7bjHhvlf8q8j3QNO2CrlOH8UN7uJDaQEdTNn-eD5fyHHa6t8QyeV2eSaaClZvQvr5aU2%7Evrnixndg6OOfq5CKbgLXogBv3uTH2dqbkB2AdtSfvP2uET4tjAHCztMLwt8FcJ3DAVS6vxvThRE0lyL%7EkY6kAW-HZLBr0qw6sZm-YWhpkfCrU6VFeHZw54UTtNcB1hkqBgBdXjF6BNMeKHvdsSIklX7Igbolux4A902YK1mgBhzNtD-2LRh5f%7E7PQ6fn4KM%7E6qh0CxEtjrBSU6-Sd%7EHxRsV4CctUIBjl87RnfjCAHaOUK85qK8ZVzFjsrleBE10cK86TKuyUw__&Key-Pair-Id=APKAXVKMENFCRKTG5XE2&Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9kMWQzNHA4dno2M29pcS5jbG91ZGZyb250Lm5ldC85MmRlMzUwYi05YWY2LTRiMzItODE3Ny0wMzMxZWRlNDA2NmIvKiIsIkNvbmRpdGlvbiI6eyJEYXRlTGVzc1RoYW4iOnsiQVdTOkVwb2NoVGltZSI6MTc5NTMzNDMyM30sIkRhdGVHcmVhdGVyVGhhbiI6eyJBV1M6RXBvY2hUaW1lIjoxNDczMTA1NDA3fX19XX0_='
      decryption_key:
        description: 'ClearKey as kid:key (hex)'
        required: true
        default: 'a5af41281e41febcdbb788ae366ecdac:862ae9b7afb13dfbaea2574948301edc'
      max_height:
        description: 'Max height in px'
        required: false
        default: '240'
      frame_count:
        description: 'How many stills to extract'
        required: false
        default: '12'
      seconds_between:
        description: 'Seconds between stills'
        required: false
        default: '8'

permissions:
  contents: read

concurrency:
  group: grab-frames-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_URL: ${{ inputs.video_url }}
      KEY: ${{ inputs.decryption_key }}
      MAX_HEIGHT: ${{ inputs.max_height }}
      FRAME_COUNT: ${{ inputs.frame_count }}
      SECONDS_BETWEEN: ${{ inputs.seconds_between }}
      BENTO4_VERSION: '1-6-0-641'

    steps:
      - name: Install ffmpeg, python, yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg python3 python3-pip unzip curl ca-certificates
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade yt-dlp

      - name: Install Bento4 (mp4decrypt)
        run: |
          curl -fsSL -o bento4.zip \
            "https://www.bok.net/Bento4/binaries/Bento4-SDK-${BENTO4_VERSION}.x86_64-unknown-linux.zip"
          unzip -q bento4.zip -d bento4
          BENTO_BIN="$PWD/$(find bento4 -maxdepth 1 -type d -name 'Bento4-SDK-*')/bin"
          echo "$BENTO_BIN" >> "$GITHUB_PATH"
          "$BENTO_BIN/mp4decrypt" --version || true

      - name: List available renditions
        run: yt-dlp --allow-u -F "$VIDEO_URL" | tee formats.txt

      - name: Download encrypted stream (fragments kept)
        run: |
          yt-dlp --allow-u \
            -f "bv*[height<=${MAX_HEIGHT}]/b[height<=${MAX_HEIGHT}]/bv*/b*" \
            --downloader native --no-part --keep-fragments \
            -o 'raw.%(ext)s' "$VIDEO_URL" 2>&1 | tee ytdlp.log

      - name: Join init + media segments
        run: |
          mapfile -t FRAGS < <(ls -1 raw.*-Frag* | sort -V)
          echo "segments: ${#FRAGS[@]}"
          cat "${FRAGS[@]}" > encrypted.mp4
          ls -l encrypted.mp4

      - name: Decrypt with ClearKey
        run: |
          mp4decrypt --key "$KEY" encrypted.mp4 clear.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,duration,nb_frames \
            -of default=nw=1 clear.mp4 | tee probe.txt

      - name: Extract stills
        run: |
          mkdir -p shots
          ffmpeg -hide_banner -loglevel error -y -i clear.mp4 \
            -vf "fps=1/${SECONDS_BETWEEN},scale=-2:${MAX_HEIGHT}" \
            -frames:v "${FRAME_COUNT}" -q:v 3 shots/shot_%03d.jpg
          ffmpeg -hide_banner -loglevel error -y -i 'shots/shot_%03d.jpg' \
            -vf "scale=320:-2,tile=4x3:padding=4" -frames:v 1 contact-sheet.jpg
          ls -l shots

      - name: Upload stills (not the video)
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.run_number }}
          path: |
            shots/
            contact-sheet.jpg
            probe.txt
            formats.txt
          retention-days: 7
          if-no-files-found: error
